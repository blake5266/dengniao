<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>等鸟 · 观鸟社区体验版</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --green:#2e7d4f; --green-light:#e8f5e9; --orange:#ef6c00; --purple:#7b1fa2; --gold:#f9a825;
  --text:#1f2a24; --muted:#7a8a80; --bg:#eef2ee; --card:#fff; --danger:#c62828;
}
body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#d8dfd9; display:flex; justify-content:center; align-items:center; min-height:100vh; color:var(--text); }
#phone { width:400px; max-width:100vw; height:850px; max-height:100vh; background:var(--bg); display:flex; flex-direction:column; box-shadow:0 10px 40px rgba(0,0,0,.25); position:relative; overflow:hidden; border-radius:18px; }

header { background:var(--green); color:#fff; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; z-index:500; flex-shrink:0; }
header h1 { font-size:17px; font-weight:600; }
header .sub { font-size:11px; opacity:.85; margin-top:2px; }
header .btns { display:flex; gap:8px; }
.icon-btn { background:rgba(255,255,255,.18); border:none; color:#fff; border-radius:10px; padding:7px 10px; font-size:12px; cursor:pointer; }
.icon-btn:hover { background:rgba(255,255,255,.3); }

main { flex:1; position:relative; overflow:hidden; }
.tab { position:absolute; inset:0; overflow-y:auto; display:none; }
.tab.active { display:block; }
nav { background:#fff; display:flex; border-top:1px solid #e3e8e4; z-index:500; flex-shrink:0; }
nav button { flex:1; border:none; background:none; padding:9px 0 12px; font-size:11.5px; color:var(--muted); cursor:pointer; position:relative; }
nav button .ic { display:block; font-size:17px; margin-bottom:1px; }
nav button.on { color:var(--green); font-weight:600; }
nav button.on::after { content:""; position:absolute; top:0; left:50%; transform:translateX(-50%); width:22px; height:3px; border-radius:2px; background:var(--green); }

#map { width:100%; height:100%; background:#e4eadf; }
.map-fallback { padding:16px; }
#report-btn { position:absolute; right:14px; bottom:76px; background:var(--green); color:#fff; border:none; border-radius:999px; padding:13px 18px; font-size:14px; font-weight:600; box-shadow:0 4px 14px rgba(46,125,79,.45); cursor:pointer; z-index:600; }
#refresh-btn { position:absolute; left:14px; bottom:76px; background:#fff; border:none; border-radius:999px; padding:10px 14px; font-size:12px; color:var(--green); box-shadow:0 2px 10px rgba(0,0,0,.15); cursor:pointer; z-index:600; }
#push-banner { position:absolute; top:10px; left:10px; right:10px; background:#1f2a24; color:#ffd54f; border-radius:12px; padding:11px 14px; font-size:12.5px; z-index:700; display:none; box-shadow:0 6px 20px rgba(0,0,0,.35); cursor:pointer; }
.bub { width:34px; height:34px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); display:flex; align-items:center; justify-content:center; box-shadow:0 3px 8px rgba(0,0,0,.3); border:2px solid #fff; }
.bub span { transform:rotate(45deg); font-size:15px; }
.bub.photo { width:48px; height:48px; border-radius:50%; transform:none; background:#fff3e0; border:3px solid var(--orange); overflow:hidden; }
.bub.photo span { transform:none; font-size:26px; }
.bub.wish { width:46px; height:46px; border-radius:50%; transform:none; background:linear-gradient(135deg,#fff8e1,#ffd54f); border:3px solid #f57f17; box-shadow:0 0 14px rgba(249,168,37,.85); animation:pulse 1.6s infinite; }
.bub.wish span { transform:none; font-size:22px; }
@keyframes pulse { 0%,100% { box-shadow:0 0 8px rgba(249,168,37,.7);} 50% { box-shadow:0 0 20px rgba(249,168,37,1);} }
.legend { position:absolute; left:12px; bottom:118px; background:#fff; border-radius:12px; padding:9px 11px; font-size:11px; color:var(--muted); box-shadow:0 2px 10px rgba(0,0,0,.12); z-index:600; line-height:1.9; }
#live-badge { position:absolute; top:10px; right:10px; background:#fff; border-radius:999px; padding:6px 12px; font-size:12px; font-weight:600; color:var(--green); box-shadow:0 2px 10px rgba(0,0,0,.15); z-index:600; }
#live-badge::before { content:""; display:inline-block; width:8px; height:8px; border-radius:50%; background:#2ecc40; margin-right:6px; vertical-align:middle; animation:pulse-dot 1.5s infinite; }
@keyframes pulse-dot { 0%,100% { opacity:1; } 50% { opacity:.3; } }
.dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:middle; }

.card { background:var(--card); border-radius:14px; padding:14px; margin:12px; box-shadow:0 2px 10px rgba(0,0,0,.06); }
.chip { display:inline-block; font-size:11px; padding:2px 8px; border-radius:999px; margin-right:5px; vertical-align:middle; }
.chip.green { background:var(--green-light); color:var(--green); }
.chip.orange { background:#fff3e0; color:var(--orange); }
.chip.gold { background:#fff8e1; color:#b26a00; }
.chip.purple { background:#f3e5f5; color:var(--purple); }
.chip.gray { background:#f0f2f0; color:var(--muted); }
.chip.red { background:#ffebee; color:var(--danger); }

.sheet-mask { position:absolute; inset:0; background:rgba(0,0,0,.35); z-index:800; display:none; }
.sheet-mask.show { display:block; }
.sheet { position:absolute; left:0; right:0; bottom:0; background:#fff; border-radius:18px 18px 0 0; z-index:900; max-height:74%; overflow-y:auto; padding:18px 16px 22px; display:none; }
.sheet.show { display:block; animation:up .25s ease; }
@keyframes up { from { transform:translateY(60px); opacity:.4; } to { transform:none; opacity:1; } }
.sheet h2 { font-size:17px; margin-bottom:2px; }
.sheet .meta { font-size:12px; color:var(--muted); margin:6px 0 10px; }
.sheet .desc { font-size:13px; line-height:1.7; color:#42504a; background:var(--bg); border-radius:10px; padding:10px 12px; margin:10px 0; }
.photo-card { border-radius:14px; overflow:hidden; margin:10px 0; text-align:center; background:#faf6ee; border:1px solid #ece3cf; }
.photo-card .ph { font-size:72px; line-height:1.3; }
.photo-card .src { font-size:11.5px; color:var(--muted); padding:0 10px 10px; }
.row-btns { display:flex; gap:10px; margin:12px 0; flex-wrap:wrap; }
.pill-btn { border:1px solid #d5ddd7; background:#fff; border-radius:999px; padding:8px 14px; font-size:13px; cursor:pointer; }
.pill-btn:active { transform:scale(.96); }
.pill-btn.primary { background:var(--green); color:#fff; border-color:var(--green); font-weight:600; }
.pill-btn.danger { background:var(--danger); color:#fff; border-color:var(--danger); font-weight:600; }
.comments { font-size:12.5px; }
.comments .c { padding:7px 0; border-top:1px solid #f0f2f0; color:#42504a; }
.comments .c b { color:var(--text); }
.comment-input { display:flex; gap:8px; margin-top:10px; align-items:center; }
.comment-input input { flex:1; }

input[type=text], textarea { width:100%; border:1px solid #d5ddd7; border-radius:10px; padding:10px 12px; font-size:14px; outline:none; font-family:inherit; }
input:focus, textarea:focus { border-color:var(--green); }
textarea { resize:none; min-height:110px; line-height:1.6; }
.search-results { max-height:220px; overflow-y:auto; margin-top:8px; }
.sr-item { padding:10px 12px; border-radius:10px; cursor:pointer; display:flex; align-items:center; gap:8px; font-size:14px; flex-wrap:wrap; }
.sr-item:hover { background:var(--green-light); }
.stepper { display:flex; align-items:center; gap:12px; margin:10px 0; }
.stepper button { width:34px; height:34px; border-radius:50%; border:1px solid #d5ddd7; background:#fff; font-size:17px; cursor:pointer; }
.label { font-size:13px; color:var(--muted); margin:12px 0 6px; }

/* identify */
.q-progress { font-size:12px; color:var(--muted); }
.q-cand { float:right; color:var(--green); font-weight:600; }
.q-title { font-size:16px; font-weight:600; margin:8px 0 14px; }
.opt-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.opt-card { border:1.5px solid #d5ddd7; background:#fff; border-radius:12px; padding:10px 6px 8px; cursor:pointer; text-align:center; }
.opt-card .ic { font-size:26px; line-height:1.5; display:block; }
.opt-card .ic svg { vertical-align:middle; }
.opt-card .lb { font-size:12px; color:var(--text); }
.opt-card.sel { background:var(--green-light); border-color:var(--green); }
.opt-card.sel .lb { color:var(--green); font-weight:600; }
.opt-chips { display:flex; flex-wrap:wrap; gap:9px; }
.opt-chip { border:1.5px solid #d5ddd7; background:#fff; border-radius:999px; padding:9px 15px; font-size:13.5px; cursor:pointer; }
.opt-chip.sel { background:var(--green); border-color:var(--green); color:#fff; font-weight:600; }
.swatches { display:flex; flex-wrap:wrap; gap:12px; }
.swatch { width:38px; height:38px; border-radius:50%; border:3px solid #e0e5e1; cursor:pointer; position:relative; }
.swatch.sel { border-color:var(--green); box-shadow:0 0 0 2px var(--green); }
.swatch .lbl { position:absolute; bottom:-18px; left:50%; transform:translateX(-50%); font-size:11px; color:var(--muted); white-space:nowrap; }
.q-foot { display:flex; justify-content:space-between; margin-top:22px; gap:10px; }
.link-btn { background:none; border:none; color:var(--green); font-size:13.5px; cursor:pointer; padding:8px; }

.res-item { border:1px solid #e5eae6; border-radius:12px; padding:12px; margin-bottom:10px; }
.res-item h3 { font-size:15px; margin-bottom:4px; }
.pt-list { font-size:12.5px; line-height:1.9; margin-top:6px; color:#42504a; }
.pt-list .ok { color:var(--green); }
.pt-list .no { color:var(--danger); }

/* community */
.post { border-bottom:1px solid #f0f2f0; padding:14px 16px; background:#fff; }
.post .p-head { display:flex; align-items:center; gap:9px; margin-bottom:8px; }
.post .ava { width:32px; height:32px; border-radius:50%; background:var(--green-light); display:flex; align-items:center; justify-content:center; font-size:16px; }
.post .p-name { font-size:13px; font-weight:600; }
.post .p-time { font-size:11px; color:var(--muted); }
.post .p-body { font-size:13.5px; line-height:1.7; color:#2c3832; }
.post .p-body img { font-size:40px; display:block; margin-top:6px; }
.post .p-acts { display:flex; gap:16px; margin-top:10px; font-size:12.5px; color:var(--muted); }
.post .p-acts span { cursor:pointer; }
.post .p-acts .liked { color:#e53935; font-weight:600; }
.post .p-comments { margin-top:8px; background:#f7f9f7; border-radius:10px; padding:8px 10px; font-size:12.5px; display:none; }
.post .p-comments.show { display:block; }
.post .p-comments .c { padding:3px 0; color:#42504a; }
.post .p-comments .c b { color:var(--text); }
#compose-btn { position:absolute; right:14px; bottom:16px; background:var(--green); color:#fff; border:none; border-radius:999px; padding:12px 17px; font-size:13.5px; font-weight:600; box-shadow:0 4px 14px rgba(46,125,79,.45); cursor:pointer; z-index:600; }
.community-wrap { position:relative; height:100%; }
#post-list { padding-bottom:80px; }

/* profile */
.profile-card { background:linear-gradient(135deg,var(--green),#4a9d6f); border-radius:14px; padding:18px; margin:12px; color:#fff; }
.profile-card .row { display:flex; align-items:center; gap:14px; }
.profile-card .big-ava { width:58px; height:58px; border-radius:50%; background:rgba(255,255,255,.25); display:flex; align-items:center; justify-content:center; font-size:30px; cursor:pointer; border:2px solid rgba(255,255,255,.6); }
.profile-card .pname { font-size:17px; font-weight:600; }
.profile-card .stats { display:flex; gap:22px; margin-top:14px; font-size:12.5px; }
.profile-card .stats b { font-size:16px; display:block; }
.wish-card { background:linear-gradient(135deg,#fff8e1,#ffecb3); border:1.5px solid #f9a825; border-radius:14px; padding:16px; margin:12px; }
.wish-card h3 { font-size:15px; color:#8a5a00; margin-bottom:4px; }
.wish-card .wish-progress { font-size:12px; color:#8a5a00; margin-bottom:10px; }
.wish-chips { display:flex; flex-wrap:wrap; gap:8px; }
.wish-chips button { border:1.5px solid #e0c060; background:#fff; border-radius:999px; padding:7px 13px; font-size:12.5px; cursor:pointer; }
.wish-chips button.sel { background:#f9a825; border-color:#f9a825; color:#fff; font-weight:600; }
.mybirds .bird-row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #f0f2f0; font-size:13.5px; }
.empty-hint { text-align:center; color:var(--muted); font-size:12.5px; padding:20px 0; }

/* modal */
.modal-mask { position:absolute; inset:0; background:rgba(0,0,0,.45); z-index:1000; display:none; align-items:center; justify-content:center; }
.modal-mask.show { display:flex; }
.modal { background:#fff; border-radius:16px; width:88%; max-height:80%; overflow-y:auto; padding:20px; }
.modal h2 { font-size:16px; margin-bottom:12px; }
.modal p { font-size:13px; line-height:1.8; color:#42504a; }
.warn-icon { font-size:40px; text-align:center; margin-bottom:8px; }
.switch-row { display:flex; align-items:center; justify-content:space-between; padding:10px 0; font-size:14px; border-bottom:1px solid #f0f2f0; }
.switch-row .s-label small { display:block; color:var(--muted); font-size:11.5px; margin-top:2px; }
.switch { width:46px; height:26px; border-radius:13px; background:#cfd6d1; position:relative; cursor:pointer; transition:.2s; flex-shrink:0; }
.switch.on { background:var(--green); }
.switch::after { content:""; position:absolute; width:20px; height:20px; border-radius:50%; background:#fff; top:3px; left:3px; transition:.2s; }
.switch.on::after { left:23px; }
.avatar-pick { display:flex; gap:10px; flex-wrap:wrap; margin:8px 0; }
.avatar-pick button { font-size:24px; width:44px; height:44px; border-radius:50%; border:2px solid #e0e5e1; background:#fff; cursor:pointer; }
.avatar-pick button.sel { border-color:var(--green); background:var(--green-light); }

#toast { position:absolute; left:50%; top:14%; transform:translateX(-50%); background:rgba(31,42,36,.92); color:#fff; font-size:13px; padding:10px 18px; border-radius:999px; z-index:1200; display:none; max-width:86%; text-align:center; }
.demo-note { font-size:10.5px; color:var(--muted); text-align:center; padding:6px 0 10px; }
</style>
</head>
<body>
<div id="phone">
  <header>
    <div>
      <h1>等鸟<span style="font-size:11px;opacity:.8">（体验版）</span></h1>
      <div class="sub">🐦 新手观鸟社区 · 北京</div>
    </div>
    <div class="btns">
      <button class="icon-btn" onclick="openSettings()">🔔</button>
      <button class="icon-btn" onclick="openDemoNote()">❓</button>
    </div>
  </header>

  <main>
    <div id="push-banner" onclick="this.style.display='none'"></div>

    <!-- 鸟讯地图 -->
    <section class="tab active" id="tab-map">
      <div id="map"></div>
      <div id="live-badge">🟢 实时鸟况 · 24 小时内</div>
      <div class="legend" id="map-legend">
        <div><span class="dot" style="background:var(--green)"></span>常见鸟（随机展示）</div>
        <div><span class="dot" style="background:var(--orange)"></span>罕见鸟 · 照片气泡</div>
        <div><span class="dot" style="background:var(--gold)"></span>⭐ 我的心愿鸟</div>
        <div><span class="dot" style="background:var(--purple)"></span>待鉴定 · 社区帮认</div>
      </div>
      <button id="refresh-btn" onclick="refreshCommon()">🔄 换一批常见鸟</button>
      <button id="report-btn" onclick="openReport()">＋ 我看到了鸟</button>
    </section>

    <!-- 识鸟 -->
    <section class="tab" id="tab-identify">
      <div class="card">
        <div class="q-progress"><span id="q-idx">第 1 / 12 题</span><span class="q-cand" id="q-cand"></span></div>
        <div class="q-title" id="q-title"></div>
        <div id="q-body"></div>
        <div class="q-foot">
          <button class="link-btn" id="q-prev" onclick="prevQ()">← 上一题</button>
          <button class="link-btn" onclick="skipQ()">不确定，跳过 →</button>
        </div>
        <div style="text-align:center;margin-top:14px">
          <button class="pill-btn primary" onclick="showResults()">直接看结果</button>
          <button class="pill-btn" onclick="resetIdentify()" style="margin-left:8px">重新开始</button>
        </div>
      </div>
      <div id="res-area"></div>
    </section>

    <!-- 社区 -->
    <section class="tab" id="tab-community">
      <div class="community-wrap">
        <div id="post-list"></div>
        <button id="compose-btn" onclick="openCompose()">✍️ 发帖</button>
      </div>
    </section>

    <!-- 本地鸟种手册 -->
    <section class="tab" id="tab-handbook">
      <div class="card">
        <div class="label">查看区域</div>
        <div class="opt-chips">
          <button class="opt-chip sel" data-hb="全市">北京 · 全市</button>
          <button class="opt-chip" data-hb="海淀区">海淀区</button>
          <button class="opt-chip" data-hb="朝阳区">朝阳区</button>
        </div>
        <div class="label">筛选</div>
        <div class="hb-filter">
          <button class="opt-chip sel" data-f="all">全部</button>
          <button class="opt-chip" data-f="common">常见</button>
          <button class="opt-chip" data-f="rare">罕见/保护</button>
          <button class="opt-chip" data-f="ebird">eBird 参考</button>
        </div>
      </div>
      <div id="hb-list"></div>
      <div class="demo-note">过去 30 天 · 数据为演示用（平台记录 + eBird 参考）</div>
    </section>

    <!-- 我的 -->
    <section class="tab" id="tab-profile">
      <div class="profile-card">
        <div class="row">
          <div class="big-ava" onclick="openAvatarPick()" id="my-ava">🐣</div>
          <div>
            <div class="pname" id="my-name">观鸟小白</div>
            <div style="font-size:12px;opacity:.85">北京 · 鸟龄 2 个月</div>
          </div>
        </div>
        <div class="stats">
          <div><b id="stat-reports">0</b>上报</div>
          <div><b id="stat-checks">2</b>打卡</div>
          <div><b id="stat-birds">0</b>鸟种库</div>
          <div><b id="stat-likes">3</b>获赞</div>
        </div>
      </div>

      <div class="wish-card" id="wish-card">
        <h3>⭐ 我的心愿鸟</h3>
        <div class="wish-progress">标记 5 种最想见到的鸟，它一出现就强提醒你（<span id="wish-count">2</span>/5）</div>
        <div class="wish-chips" id="wish-chips"></div>
        <div style="margin-top:10px"><button class="pill-btn" style="border-color:#e0c060;width:100%" onclick="openWishSearch()">🔍 搜索添加心愿鸟</button></div>
      </div>

      <div class="card">
        <div class="switch-row" style="border:none" onclick="openSettings()" >
          <div class="s-label">🔔 提醒设置<small>罕见鸟 / 心愿鸟 推送规则</small></div>
          <div style="color:var(--muted)">›</div>
        </div>
      </div>

      <div class="card">
        <h3 style="font-size:14px;margin-bottom:8px">📖 我的鸟种库</h3>
        <div id="my-birds" class="mybirds"></div>
      </div>
      <div class="demo-note">正式版使用微信登录，这里演示昵称/头像/心愿鸟设置</div>
    </section>

    <!-- 鸟讯详情 sheet -->
    <div class="sheet-mask" id="sheet-mask" onclick="closeSheet()"></div>
    <div class="sheet" id="sheet"></div>

    <!-- 上报 modal -->
    <div class="modal-mask" id="report-mask" onclick="if(event.target===this)closeReport()">
      <div class="modal" id="report-modal"></div>
    </div>

    <!-- 拦截 modal -->
    <div class="modal-mask" id="block-mask">
      <div class="modal" id="block-modal"></div>
    </div>

    <!-- 发帖 modal -->
    <div class="modal-mask" id="compose-mask" onclick="if(event.target===this)closeCompose()">
      <div class="modal" id="compose-modal"></div>
    </div>

    <!-- 提醒设置 modal -->
    <div class="modal-mask" id="settings-mask" onclick="if(event.target===this)closeSettings()">
      <div class="modal" id="settings-modal"></div>
    </div>

    <!-- 头像选择 modal -->
    <div class="modal-mask" id="avatar-mask" onclick="if(event.target===this)this.classList.remove('show')">
      <div class="modal" id="avatar-modal"></div>
    </div>

    <!-- 心愿鸟搜索 modal -->
    <div class="modal-mask" id="wish-mask" onclick="if(event.target===this)this.classList.remove('show')">
      <div class="modal" id="wish-modal"></div>
    </div>

    <!-- 演示说明 modal -->
    <div class="modal-mask" id="note-mask" onclick="this.classList.remove('show')">
      <div class="modal" id="note-modal"></div>
    </div>

let my = {nickname:'观鸟小白', avatar:'🐣', birds:[]};

let myStats = {reports:0, checks:2, likes:3};

/* ============ 工具 ============ */
const $ = id => document.getElementById(id);
let toastTimer;
function toast(msg, ms=2400){
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.style.display='none', ms);
}
function switchTab(tab){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.tab===tab));
  document.querySelectorAll('.tab').forEach(s=>s.classList.toggle('active', s.id===tab));
  if(tab==='tab-map' && map) setTimeout(()=>map.invalidateSize(), 60);
}
function fmtMin(m){
  if(m<60) return m+'分钟前';
  if(m<1440) return Math.floor(m/60)+'小时前';
  return Math.floor(m/1440)+'天前';
}
function distText(){ return (0.3+Math.random()*3).toFixed(1)+'km'; }

/* ============ 地图 ============ */
let map = null, markerLayer = null;
function initMap(){
  if(typeof L === 'undefined'){
    $('map').innerHTML = '<div class="map-fallback"><h3>地图底图加载失败（需联网）</h3><div id="fb-list"></div></div>';
    let html = '';
    SIGHTINGS.filter(s=>s.min<=1440).forEach(s=>{
      html += `<div class="hb-item"><div class="l"><span>${s.sp?byId[s.sp].name:'❓ 未识别鸟 · 待鉴定'}</span></div><div class="r">${fmtMin(s.min)}</div></div>`;
    });
    $('map').querySelector('#fb-list').innerHTML = html;
    return;
  }
  map = L.map('map').setView([39.995,116.391],14);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{maxZoom:19,attribution:'© OSM © CARTO'}).addTo(map);
  renderSightings();
}
function bubbleIcon(sp, unknown){
  if(!sp){ return L.divIcon({className:'',html:'<div class="bub" style="background:var(--purple)"><span>?</span></div>',iconSize:[34,34],iconAnchor:[17,17]}); }
  if(spIsWish(sp)){
    return L.divIcon({className:'',html:`<div class="bub wish"><span>⭐</span></div>`,iconSize:[46,46],iconAnchor:[23,23]});
  }
  if(spIsRare(sp)){
    return L.divIcon({className:'',html:`<div class="bub photo"><span>${sp.emoji}</span></div>`,iconSize:[48,48],iconAnchor:[24,24]});
  }
  let inner = sp.emoji || '🐦';
  return L.divIcon({className:'',html:`<div class="bub" style="background:var(--green)"><span>${inner}</span></div>`,iconSize:[34,34],iconAnchor:[17,17]});
}
function renderSightings(){
  if(!map) return;
  if(markerLayer) markerLayer.remove();
  markerLayer = L.layerGroup().addTo(map);
  SIGHTINGS.forEach(s=>{
    if(s.min>1440) return; // 24h 过期不显示
    const sp = s.sp ? byId[s.sp] : null;
    const ll = [s.lat,s.lng];
    // 常见鸟随机展示（太多的话刷屏）；罕见鸟/心愿鸟/待鉴定全部展示
    const isCommon = sp && !spIsRare(sp) && !spIsWish(sp);
    if(isCommon && Math.random() < 0.35) return;
    const mk = L.marker(ll,{icon:bubbleIcon(sp,!s.sp)});
    mk.on('click',()=>openDetail(s));
    markerLayer.addLayer(mk);
  });
}
function refreshCommon(){ renderSightings(); toast('已随机换一批常见鸟气泡 🐦'); }
function addSightingMarker(sp){
  const ll = [39.995+(Math.random()-0.5)*0.02, 116.391+(Math.random()-0.5)*0.02];
  SIGHTINGS.push({id:99+Math.random(),sp:sp.id,min:0,lat:ll[0],lng:ll[1],count:1,userPhoto:true,reporter:my.nickname,likes:0,checks:0,comments:[]});
  const s = SIGHTINGS[SIGHTINGS.length-1];
  const mk = L.marker(ll,{icon:bubbleIcon(sp,false)});
  mk.on('click',()=>openDetail(s));
  markerLayer.addLayer(mk);
}

/* ============ 鸟讯详情 ============ */
function openDetail(s){
  const sp = s.sp ? byId[s.sp] : null;
  const rare = spIsRare(sp);
  let html = `<h2>${sp?sp.name:'❓ 未识别鸟'} `;
  if(sp) html += `<span class="chip ${PROT[sp.prot][1]}">${PROT[sp.prot][0]}</span>`;
  if(sp && sp.regionalRare) html += `<span class="chip gold">区域罕见</span>`;
  if(spIsWish(sp)) html += `<span class="chip gold">⭐ 心愿鸟</span>`;
  if(sp && sp.prot===0 && sp.rarity==='rare') html += `<span class="chip gold">区域罕见</span>`;
  if(!sp) html += `<span class="chip purple">待鉴定</span>`;
  html += `</h2>`;
  html += `<div class="meta">${fmtMin(s.min)} · 距你约 ${distText()} · 数量 ${s.count} 只 · 上报者：${s.reporter}</div>`;
  if(s.unknown) html += `<div class="desc">📝 上报者描述：「${s.unknown}」</div>`;
  if(rare){
    html += `<div class="photo-card"><div class="ph">${sp.emoji}</div><div class="src">${s.userPhoto?'📸 用户实拍照片':'🖼️ 图库照片'}（演示占位图，正式版为真实照片）</div></div>`;
    html += `<div class="desc">🔥 <b>罕见鸟现身！</b>${sp.prot===2?'国家二级保护动物':sp.regionalRare?'该鸟在北京极少出现':'本地罕见记录'}。看到就是赚到，快去围观～（请保持距离、不诱拍）</div>`;
  }
  if(sp) html += `<div class="desc">${sp.desc}</div>`;
  html += `<div class="row-btns">`;
  html += `<button class="pill-btn" onclick="likeSighting(${s.id})">❤️ 围观 ${s.likes}</button>`;
  html += `<button class="pill-btn" onclick="checkSighting(${s.id})">✅ 打卡 ${s.checks}</button>`;
  html += `<button class="pill-btn" onclick="thanks(${s.reporter})">🙏 感谢</button>`;
  html += `<button class="pill-btn" onclick="closeSheet();openCompose(sightingPostTemplate(${s.id}))">💬 发帖讨论</button>`;
  if(sp) html += `<button class="pill-btn" onclick="goIdentify()">🔍 怎么认它？</button>`;
  html += `</div>`;
  if(s.comments.length){
    html += `<div class="comments">${s.comments.map(c=>`<div class="c"><b>${c.u}</b>：${c.t}</div>`).join('')}</div>`;
  } else {
    html += `<div class="comments"><div class="c" style="color:var(--muted)">还没有留言，来抢沙发～</div></div>`;
  }
  $('sheet').innerHTML = html;
  $('sheet').classList.add('show');
  $('sheet-mask').classList.add('show');
  // 强提醒横幅模拟（罕见鸟 或 心愿鸟）
  if(sp && (rare || spIsWish(sp)) && (settings.t1||settings.t3)){
    const kind = spIsWish(sp) ? `你的心愿鸟「${sp.name}」` : `罕见鸟「${sp.name}」`;
    const b = $('push-banner');
    b.innerHTML = `🔔 <b>强提醒</b>（模拟推送）：${kind} 于 ${fmtMin(s.min)} 出现在你附近 3km 内`;
    b.style.display='block';
    setTimeout(()=>{ if(b.style.display==='block') b.style.display='none'; }, 6000);
  }
}
function closeSheet(){ $('sheet').classList.remove('show'); $('sheet-mask').classList.remove('show'); }
function likeSighting(id){ const s=SIGHTINGS.find(x=>x.id===id); s.likes++; toast('围观 +1，感谢关注这个鸟讯！'); openDetail(s); }
function checkSighting(id){ const s=SIGHTINGS.find(x=>x.id===id); s.checks++; myStats.checks++; toast('打卡成功！我到了，看到它了 🎉'); renderProfile(); openDetail(s); }
function thanks(name){ toast(`已感谢「${name}」的分享 🙏`); }

function reportSearch(q){

  const hits = SPECIES.filter(s=>s.name.includes(q.trim())).slice(0,8);

let rpN = 1;
function rpCount(d){ rpN = Math.max(1, rpN+d); $('rp-count').textContent = rpN; }
function submitReport(){
  if(!reportSel){ toast('请先搜索并选择鸟种'); return; }
  if(reportSel.prot === 1){
    // L1 禁报清单：国一隐藏，提交时拦截并告知原因
    $('block-modal').innerHTML = `
      <div class="warn-icon">🛑</div>
      <h2 style="text-align:center">无法上报：${reportSel.name}</h2>
      <p style="margin:10px 0">「${reportSel.name}」为<b style="color:var(--danger)">国家一级保护动物</b>，在<b>禁报清单</b>中。</p>
      <p>因保护因素，该鸟种<b>不公开任何出现信息</b>。看到它，请为它保密——不公开精确位置、不追逐、不诱拍。</p>
      <div class="row-btns" style="justify-content:center;margin-top:16px">
        <button class="pill-btn danger" onclick="document.getElementById('block-mask').classList.remove('show');closeReport()">知道了</button>
      </div>`;
    $('block-mask').classList.add('show');
    return;
  }
  closeReport();
  myStats.reports++;
  renderProfile();
  addSightingMarker(reportSel);
  if(spIsRare(reportSel)) toast('已上报！罕见鸟将触发周边鸟友强提醒 🔥');
  else toast('已上报！周边鸟友将在 24 小时内看到这个气泡 🎉');
  switchTab('tab-map');
}

/* ============ 识鸟 ============ */
const QUESTIONS = [
 {key:'prov',type:'chips',label:'你在哪里看到的？',opts:['北京','青海']},
 {key:'month',type:'chips',label:'什么月份看到的？',opts:['1-3月','4-6月','7-9月','10-12月']},
 {key:'env',type:'icon',label:'在什么环境看到的？',opts:ENVS},
 {key:'size',type:'icon',label:'它有多大？',opts:Object.values(SIZES)},
 {key:'group',type:'icon',label:'长得像哪一类？',opts:Object.values(GROUPS)},
 {key:'face',type:'swatch',label:'头脸是什么颜色？',opts:COLORS},
 {key:'wing',type:'swatch',label:'翅膀是什么颜色？',opts:COLORS},
 {key:'belly',type:'swatch',label:'胸腹是什么颜色？',opts:COLORS},
 {key:'beak',type:'icon',label:'嘴长什么样？',opts:Object.values(BEAKS)},
 {key:'tail',type:'chips',label:'尾巴多长？',opts:TAILS},
 {key:'tailShape',type:'icon',label:'尾巴什么形状？',opts:TAILSHAPES},
 {key:'marks',type:'icon',label:'有没有这些特征？（可多选）',opts:MARKS}
];
const SIZES_REV = Object.fromEntries(Object.entries(SIZES).map(([k,v])=>[v,k]));
const GROUPS_REV = Object.fromEntries(Object.entries(GROUPS).map(([k,v])=>[v,k]));
const BEAKS_REV = Object.fromEntries(Object.entries(BEAKS).map(([k,v])=>[v,k]));
let answers = {prov:'北京', month:'7-9月'};
let qIdx = 0;

function monthOk(sp, m){
  if(m==='1-3月') return sp.season==='R'||sp.season==='W';
  if(m==='4-6月') return sp.season==='R'||sp.season==='S';
  if(m==='7-9月') return sp.season==='R'||sp.season==='S';
  return sp.season==='R'||sp.season==='W';
}
function getPool(){
  let pool = SPECIES.filter(s=>s.prov.includes(answers.prov));
  if(answers.month) pool = pool.filter(s=>monthOk(s,answers.month));
  return pool;
}
function scoreSp(sp){
  let score=0, matched=[], missed=[];
  const fields = [
    ['env',sp.env,'环境'],['size',SIZES[sp.size],'大小'],['group',GROUPS[sp.group],'长相'],
    ['face',sp.face,'头脸'],['wing',sp.wing,'翅膀'],['belly',sp.belly,'胸腹'],
    ['beak',BEAKS[sp.beak],'嘴'],['tail',sp.tail,'尾巴'],['tailShape',sp.tailShape,'尾形']
  ];
  fields.forEach(([key,val,label])=>{
    if(answers[key]===undefined) return;
    if(val===answers[key]){ score+=2; matched.push(`${label}：${answers[key]}`); }
    else { score-=2; missed.push(`${label}：${answers[key]}`); }
  });
  if(answers.marks && answers.marks.length){
    const has = answers.marks.some(m=>sp.marks.includes(m));
    if(has){ score+=2; matched.push(`特征：${answers.marks.filter(m=>sp.marks.includes(m)).join('、')}`); }
    else { score-=2; missed.push(`特征：${answers.marks.join('、')}`); }
  }
  return {score,matched,missed};
}
function optIcon(key, opt){
  if(key==='size') return `<span class="ic" style="font-size:${SIZE_PX[SIZES_REV[opt]]}px">${SIZE_ICONS[SIZES_REV[opt]]}</span>`;
  if(key==='group') return `<span class="ic">${GROUP_ICONS[GROUPS_REV[opt]]}</span>`;
  if(key==='beak') return `<span class="ic">${BEAK_SVG[BEAKS_REV[opt]]}</span>`;
  if(key==='tailShape') return `<span class="ic">${TAIL_SVG[opt]}</span>`;
  if(key==='env') return `<span class="ic">${ENV_ICONS[opt]}</span>`;
  if(key==='marks') return `<span class="ic">${MARK_ICONS[opt]}</span>`;
  return `<span class="ic">${opt}</span>`;
}
function renderQ(){
  const q = QUESTIONS[qIdx];
  $('q-idx').textContent = `第 ${qIdx+1} / ${QUESTIONS.length} 题`;
  $('q-cand').textContent = `候选中 ${getPool().length} 种`;
  $('q-title').textContent = q.label;
  const cur = answers[q.key];
  let html = '';
  if(q.type==='swatch'){
    html = `<div class="swatches">`+q.opts.map(c=>`
      <div style="text-align:center"><div class="swatch ${cur===c?'sel':''}" style="background:${SWATCH_COLORS[c]}" onclick="answer('${q.key}','${c}')"><span class="lbl">${c}</span></div></div>
    `).join('')+`</div><div style="height:20px"></div>`;
  } else if(q.type==='icon'){
    html = `<div class="opt-grid">`+q.opts.map(o=>{
      const isSel = q.key==='marks' ? (cur&&cur.includes(o)) : (cur===o);
      const fn = q.key==='marks' ? `answerMulti('${q.key}','${o}')` : `answer('${q.key}','${o.replace(/'/g,"")}')`;
      return `<div class="opt-card ${isSel?'sel':''}" onclick="${fn}">${optIcon(q.key,o)}<div class="lb">${o}</div></div>`;
    }).join('')+`</div>`;
  } else {
    html = `<div class="opt-chips">`+q.opts.map(o=>`
      <button class="opt-chip ${cur===o?'sel':''}" onclick="answer('${q.key}','${o.replace(/'/g,"")}')">${o}</button>
    `).join('')+`</div>`;
  }
  $('q-body').innerHTML = html;
  $('q-prev').style.visibility = qIdx===0 ? 'hidden' : 'visible';
}
function answer(key,val){
  answers[key] = answers[key]===val ? undefined : val;
  if(qIdx<QUESTIONS.length-1){ qIdx++; renderQ(); } else checkAutoResult();
}
function answerMulti(key,val){
  answers[key] = answers[key]||[];
  const i = answers[key].indexOf(val);
  if(i>=0) answers[key].splice(i,1); else answers[key].push(val);
  renderQ();
}
function skipQ(){ if(qIdx<QUESTIONS.length-1){ qIdx++; renderQ(); } else checkAutoResult(); }
function prevQ(){ if(qIdx>0){ qIdx--; renderQ(); } }
function resetIdentify(){ answers={prov:'北京',month:'7-9月'}; qIdx=0; renderQ(); $('res-area').innerHTML=''; }
function checkAutoResult(){
  const pool = getPool();
  const answered = Object.values(answers).filter(v=>v!==undefined&&(!Array.isArray(v)||v.length)).length;
  if(pool.length<=6 && answered>=4) showResults();
}
let lastResults = [];
function showResults(){
  const pool = getPool();
  const scored = pool.map(sp=>({sp, ...scoreSp(sp)})).sort((a,b)=>b.score-a.score);
  const top = scored.filter(x=>x.score>0).slice(0,5);
  lastResults = top.map(x=>x.sp);
  let html = `<div class="card"><h3 style="font-size:15px">🔍 识别结果</h3>
    <p style="font-size:12.5px;color:var(--muted);margin-top:6px">系统检索了 ${SPECIES.length} 种鸟（演示库），结合你的描述，为你找到 Top ${top.length}：</p></div>`;
  if(!top.length){
    html += `<div class="card" style="text-align:center;color:var(--muted)"><p>描述太少或互相矛盾，建议再回答几题，或发帖求助：</p>
      <div class="row-btns" style="justify-content:center;margin-top:10px">
      <button class="pill-btn primary" onclick="openCompose(identifyPostTemplate())">🙋 发到社区求助鉴定</button></div></div>`;
  } else {
    top.forEach(({sp,score,matched,missed})=>{
      const [ptxt,pcls]=PROT[sp.prot];
      html += `<div class="card res-item">
        <h3>${sp.emoji} ${sp.name} <span class="chip ${pcls}">${ptxt}</span>${spIsRare(sp)?'<span class="chip gold">罕见</span>':''}<span style="float:right;font-size:12px;color:var(--muted)">匹配 ${score} 分</span></h3>
        <div style="font-size:12px;color:var(--muted)">${SIZES[sp.size]} · ${GROUPS[sp.group]} · ${sp.season==='R'?'留鸟':sp.season==='S'?'夏候鸟':'冬候鸟'}</div>
        <div class="pt-list">
          ${matched.map(m=>`<div class="ok">✓ ${m}</div>`).join('')}
          ${missed.slice(0,3).map(m=>`<div class="no">✗ ${m}</div>`).join('')}
        </div>
        <div style="font-size:12.5px;color:#42504a;margin-top:6px">${sp.desc}</div>
        ${sp.similar.length?`<div style="font-size:12px;color:var(--muted);margin-top:6px">易混淆：${sp.similar.join('、')}（注意对比）</div>`:''}
        <div class="row-btns" style="margin-top:10px">
          <button class="pill-btn primary" onclick="confirmBird('${sp.name}')">✅ 确认是它</button>
          <button class="pill-btn" onclick="openCompose(identifyPostTemplate())">🤔 还不确定</button>
        </div>
      </div>`;
    });
  }
  html += `<div style="text-align:center;padding-bottom:16px"><button class="link-btn" onclick="resetIdentify()">↺ 重新识别</button></div>`;
  $('res-area').innerHTML = html;
  $('tab-identify').scrollTo({top:0,behavior:'smooth'});
}
function confirmBird(name){
  if(!my.birds.includes(name)) my.birds.push(name);
  renderProfile();
  toast(`已记入「我的鸟种库」🎉 恭喜加新：${name}`);
}

/* ============ 社区（发帖/点赞/评论） ============ */
function sightingPostTemplate(sid){
  const s = SIGHTINGS.find(x=>x.id===sid);
  const sp = s.sp ? byId[s.sp] : null;
  if(!sp) return {cat:'求助鉴定', body:`我在附近看到一只不认识的小鸟，描述：「${s.unknown||''}」。大家帮我看看是什么鸟？`};
  return {cat:'鸟讯讨论', body:`刚在附近看到【${sp.name}】${spIsRare(sp)?'（罕见鸟！）':''}，${s.count}只，有鸟友一起蹲吗？坐标见鸟讯。`};
}
function identifyPostTemplate(){
  const pool = getPool();
  const desc = [];
  ['size','group','face','wing','belly','beak','tail','tailShape'].forEach(k=>{
    if(answers[k]!==undefined) desc.push(answers[k]);
  });
  if(answers.marks && answers.marks.length) desc.push(...answers.marks);
  const cand = lastResults.length ? ` 候选：${lastResults.slice(0,3).map(s=>s.name).join('、')}。` : '';
  return {cat:'求助鉴定', body:`求助鉴定：今天在${answers.prov||'北京'}看到一只鸟，${desc.length?desc.join('、'):'（描述补充中）'}。${cand}请大家帮忙看看！`};
}
function openCompose(tpl){
  const t = tpl || {cat:'自由分享', body:''};
  $('compose-modal').innerHTML = `
    <h2>✍️ 发帖</h2>
    <p style="font-size:12px;color:var(--muted)">已按场景生成模板，你可以随意修改</p>
    <div class="label">话题</div>
    <div class="opt-chips" id="cp-cats">
      ${['求助鉴定','鸟讯讨论','新手交流','自由分享'].map(c=>`<button class="opt-chip ${c===t.cat?'sel':''}" onclick="pickCat('${c}')">${c}</button>`).join('')}
    </div>
    <div class="label">内容</div>
    <textarea id="cp-body">${t.body}</textarea>
    <div class="row-btns" style="margin-top:14px">
      <button class="pill-btn primary" onclick="publishPost()">发布</button>
      <button class="pill-btn" onclick="closeCompose()">取消</button>

let cpCat = '自由分享';
function pickCat(c){ cpCat = c; document.querySelectorAll('#cp-cats .opt-chip').forEach(b=>b.classList.toggle('sel', b.textContent===c)); }
function closeCompose(){ $('compose-mask').classList.remove('show'); }
function publishPost(){
  const body = $('cp-body').value.trim();
  if(!body){ toast('写点什么再发布吧'); return; }
  POSTS.unshift({id:Date.now(),cat:cpCat,author:my.nickname,avatar:my.avatar,minAgo:0,body,emoji:cpCat==='求助鉴定'?'❓':cpCat==='鸟讯讨论'?'🗺️':cpCat==='新手交流'?'🙋':'🐦',likes:0,liked:false,comments:[]});
  closeCompose();

}
function renderPosts(){
  $('post-list').innerHTML = POSTS.map(p=>`
    <div class="post">
      <div class="p-head">
        <div class="ava">${p.avatar}</div>
        <div style="flex:1">
          <div class="p-name">${p.author} <span class="chip ${p.cat==='求助鉴定'?'purple':p.cat==='鸟讯讨论'?'orange':'green'}">${p.cat}</span></div>
          <div class="p-time">${fmtMin(p.minAgo)}</div>
        </div>
      </div>
      <div class="p-body">${p.body}<span style="font-size:36px;display:block;margin-top:4px">${p.emoji}</span></div>
      <div class="p-acts">
        <span class="${p.liked?'liked':''}" onclick="likePost(${p.id})">${p.liked?'❤️':'🤍'} ${p.likes}</span>

      </div>
      <div class="p-comments" id="pc-${p.id}">
        ${p.comments.map(c=>`<div class="c"><b>${c.u}</b>：${c.t}</div>`).join('')||'<div class="c" style="color:var(--muted)">还没有评论</div>'}
        <div class="comment-input">
          <input type="text" id="pc-input-${p.id}" placeholder="友善发言…" onkeydown="if(event.key==='Enter')commentPost(${p.id})">

function likePost(id){ const p=POSTS.find(x=>x.id===id); p.liked=!p.liked; p.likes+=p.liked?1:-1; renderPosts(); }
function togglePostComments(id){ const el=$('pc-'+id); if(el) el.classList.toggle('show'); }
function commentPost(id){
  const inp=$('pc-input-'+id); const txt=inp.value.trim();
  if(!txt){ toast('写点什么吧'); return; }
  const p=POSTS.find(x=>x.id===id);
  p.comments.push({u:my.nickname,t:txt});
  inp.value='';
  renderPosts();
  const el=$('pc-'+id); if(el) el.classList.add('show');
  toast('评论成功 💬');
}

function toggleS(key,el){ settings[key]=!settings[key]; el.classList.toggle('on',settings[key]); }
function removeWish(name){
  settings.wishes = settings.wishes.filter(w=>w!==name);
  renderProfile();
  if(map) renderSightings();
  toast(`已移除心愿鸟「${name}」`);

function openWishSearch(){
  $('wish-modal').innerHTML = `
    <h2>⭐ 添加心愿鸟</h2>
    <p style="font-size:12px;color:var(--muted)">搜索鸟名添加，最多 5 种（当前 <span id="ws-count">${settings.wishes.length}</span>/5）</p>
    <input type="text" id="ws-q" placeholder="输入鸟名，如：灰鹤 / 宝兴歌鸲" oninput="wishSearch(this.value)" style="margin-top:8px" autocomplete="off">
    <div id="ws-hint" style="font-size:12px;color:var(--muted);margin:10px 0 4px">不搜索时推荐这些（罕见/保护鸟，心愿鸟首选）：</div>
    <div class="search-results" id="ws-res" style="max-height:300px"></div>
    <div style="margin-top:12px;text-align:center"><button class="pill-btn primary" onclick="document.getElementById('wish-mask').classList.remove('show')">完成</button></div>`;
  $('wish-mask').classList.add('show');
  wishSearch('');
  setTimeout(()=>{ const inp=$('ws-q'); if(inp) inp.focus(); }, 100);
}
function wishSearch(q){
  const qq = (q||'').replace(/'/g,"").trim();
  const box = $('ws-res');
  const hint = $('ws-hint');
  let list;
  if(qq){
    hint.style.display='none';
    list = SPECIES.filter(s=>s.name.includes(qq));
  } else {
    hint.style.display='block';
    list = SPECIES.filter(s=>s.prot>=1 || s.regionalRare || s.rarity==='rare').slice(0,10);
  }
  box.innerHTML = list.map(s=>{
    const added = settings.wishes.includes(s.name);
    const full = settings.wishes.length>=5 && !added;
    return `<div class="sr-item">
      <span style="font-size:20px">${s.emoji}</span>
      <div style="flex:1"><b>${s.name}</b> <span class="chip ${PROT[s.prot][1]}">${PROT[s.prot][0]}</span>${s.regionalRare?'<span class="chip gold">区域罕见</span>':''}</div>
      ${added
        ? `<button class="pill-btn" style="padding:4px 10px;font-size:12px" onclick="removeWish('${s.name}');wishSearch('${qq}')">已添加 ✕</button>`
        : `<button class="pill-btn primary" style="padding:4px 10px;font-size:12px" ${full?'disabled':''} onclick="addWish('${s.name}');wishSearch('${qq}')">＋ 添加</button>`}
    </div>`;
  }).join('') || '<div class="sr-item" style="color:var(--muted)">没有找到，换个写法试试（演示库仅 33 种）</div>';
  const c = $('ws-count'); if(c) c.textContent = settings.wishes.length;
}
function addWish(name){
  if(settings.wishes.length>=5){ toast('最多选 5 种心愿鸟'); return; }
  if(settings.wishes.includes(name)) return;
  settings.wishes.push(name);
  renderProfile();
  if(map) renderSightings();
  toast(`已添加心愿鸟「${name}」⭐ 它一出现就强提醒你`);
}
